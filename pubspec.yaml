name: tasks
description: Prepdesk study planning, spaced revision, and test preparation.

version: 1.0.22+23

environment:
  sdk: ">=2.17.0 <4.0.0"

publish_to: none

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: 3.0.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  community_material_icon: ^5.9.55
  flutter_markdown: ^0.7.4+1
  http: ^1.2.1
  crypto: ^3.0.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: 2.3.6
  path_provider_platform_interface: ^2.1.2

dependency_overrides:
  # sqflite_common_ffi 2.x uses the sqlite3 2.x open.dart API in CI tests.
  sqlite3: 2.9.4
  platform: ^3.1.5
  local_auth_android: 1.0.40
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/google_fonts/NotoSans-Regular.ttf
        - asset: assets/google_fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/NotoSans-Italic.ttf
          style: italic

  assets:
    - assets/images/
    - assets/google_fonts/
    - assets/data/nyro.db
