name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter (CI only)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Install SQLite test runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Compiler and analyzer checks
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Regression tests
        run: flutter test
      - name: Build GitHub APK
        run: flutter build apk --release --flavor github
      - name: Build Google Play bundle
        run: flutter build appbundle --release --flavor play --dart-define=NYRO_PLAY_STORE=true
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-github-release.apk release/app-release.apk
          cp build/app/outputs/bundle/playRelease/app-play-release.aab release/nyro-tasks-play.aab
          sha256sum release/* > release/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NYRO-Tasks-Release
          path: release/*
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NYRO-UI-Previews
          path: build/ui-previews/*.png
          if-no-files-found: ignore
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
