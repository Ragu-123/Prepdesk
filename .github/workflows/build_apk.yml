name: Build Android APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter (CI only)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install SQLite test runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install Android SDK 37
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdk_manager="$(command -v sdkmanager || find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
      - name: Get dependencies
        run: flutter pub get
      - name: Compiler and analyzer checks
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Embedded desktop script checks
        run: python3 scripts/check_desktop_script.py
      - name: Shared theme role checks
        run: python3 scripts/check_theme_roles.py
      - name: Regression tests
        timeout-minutes: 5
        run: flutter test --reporter expanded
      - name: Build GitHub APK
        run: |
          mkdir -p release
          flutter build apk --release --flavor github --target-platform android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-github-release.apk release/app-release.apk
          PREPDESK_APK_ABI=arm64-v8a flutter build apk --release --flavor github --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-github-release.apk release/prepdesk-arm64-v8a.apk
          PREPDESK_APK_ABI=x86_64 flutter build apk --release --flavor github --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-github-release.apk release/prepdesk-x86_64.apk
      - name: Build Google Play bundle
        run: flutter build appbundle --release --flavor play --target-platform android-arm64,android-x64 --dart-define=NYRO_PLAY_STORE=true
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/app/outputs/bundle/playRelease/app-play-release.aab release/prepdesk-play.aab
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          python3 scripts/check_release_packages.py release "$sdk_root/build-tools/37.0.0/aapt"
          sha256sum release/* > release/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prepdesk-Android-Release
          path: release/*
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prepdesk-UI-Previews
          path: |
            build/ui-previews/*.png
            build/desktop-preview/**
          if-no-files-found: ignore
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: Prepdesk ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
