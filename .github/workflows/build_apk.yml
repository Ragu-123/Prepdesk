name: Build Android APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pre-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter (CI only)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install SQLite test runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install Android SDK 37
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdk_manager="$(command -v sdkmanager || find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
      - name: Get dependencies
        run: flutter pub get
      - name: Compiler and analyzer checks
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Embedded desktop script checks
        run: python3 scripts/check_desktop_script.py
      - name: Shared theme role checks
        run: python3 scripts/check_theme_roles.py
      - name: Regression tests
        timeout-minutes: 5
        run: flutter test --reporter expanded
      - name: Build GitHub APK
        run: |
          mkdir -p release
          flutter build apk --release --flavor github --target-platform android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-github-release.apk release/app-release.apk
          PREPDESK_APK_ABI=arm64-v8a flutter build apk --release --flavor github --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-github-release.apk release/prepdesk-arm64-v8a.apk
          PREPDESK_APK_ABI=x86_64 flutter build apk --release --flavor github --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-github-release.apk release/prepdesk-x86_64.apk
      - name: Test PrepChat packet compatibility
        working-directory: android
        run: ./gradlew :bitchat:testDebugUnitTest
      - name: Prepare release assets
        run: |
          mkdir -p release
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          python3 scripts/check_release_packages.py release "$sdk_root/build-tools/37.0.0/aapt"
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prepdesk-Android-Release
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prepdesk-UI-Previews
          path: |
            build/ui-previews/*.png
            build/desktop-preview/**
          if-no-files-found: ignore
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Match release tag to the successful pre-prod build
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout may recreate the local tag as a reference to the event commit.
          git fetch --no-tags origin "+$GITHUB_REF:$GITHUB_REF"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse HEAD)"
          run_id="$(git for-each-ref --format='%(contents:trailers:key=Build-Run,valueonly)' "$GITHUB_REF" | tr -d '[:space:]')"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_apk.yml" --jq .id)"
          jq -e --argjson workflow "$workflow_id" '
            .workflow_id == $workflow and .head_branch == "pre-prod" and
            .event == "workflow_dispatch" and .conclusion == "success"
          ' <<< "$run" > /dev/null
          build_sha="$(jq -er .head_sha <<< "$run")"
          build_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$build_sha" --jq .tree.sha)"
          test "$build_tree" = "$(git rev-parse 'HEAD^{tree}')"
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download tested release packages
        uses: actions/download-artifact@v4
        with:
          name: Prepdesk-Android-Release
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ steps.provenance.outputs.run_id }}
      - name: Verify release files
        run: |
          sha256sum -c release/SHA256SUMS.txt
          for package in app-release.apk prepdesk-arm64-v8a.apk prepdesk-x86_64.apk; do
            test -s "release/$package"
          done
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          name: Prepdesk ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
